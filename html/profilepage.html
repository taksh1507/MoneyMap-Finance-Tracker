<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page - MoneyMap</title>
    <link rel="stylesheet" href="../css/profilepage-styles.css" />
    <!-- Updated CSS path -->
    <script type="module" src="../js/profilepage.js" defer></script>
    <!-- Updated JS path -->
  </head>
  <body>
    <h1>Welcome to the MoneyMap</h1>
    <div class="flex-container">
      <!-- Flex container for layout -->
      <div class="profile-section">
        <!-- Profile Info Section -->
        <button id="toggleButton">Show/Hide Profile Info</button>

        <div id="profileInfo" style="display: none">
          <!-- Initially hidden -->
          <div id="profileView" style="margin-bottom: 20px;">
            <div>First Name: <span id="loggedUserFName"></span></div>
            <div>Last Name: <span id="loggedUserLName"></span></div>
            <div>Email: <span id="loggedUserEmail"></span></div>
            <br>
            <button id="editProfileBtn" style="padding: 5px 10px; background: #36A2EB; border: none; border-radius: 4px; color: white; cursor: pointer;">Edit Profile</button>
            <button id="logout" style="padding: 5px 10px; background: #ff4d4d; border: none; border-radius: 4px; color: white; cursor: pointer;">Logout</button>
          </div>
          
          <div id="profileEdit" style="display: none; margin-bottom: 20px;">
            <input type="text" id="editFName" placeholder="First Name" style="padding: 5px; margin-bottom: 10px; width: 100%; border-radius: 4px; border: none;" />
            <input type="text" id="editLName" placeholder="Last Name" style="padding: 5px; margin-bottom: 10px; width: 100%; border-radius: 4px; border: none;" />
            <button id="saveProfileBtn" style="padding: 5px 10px; background: #4BC0C0; border: none; border-radius: 4px; color: white; cursor: pointer;">Save</button>
            <button id="cancelEditBtn" style="padding: 5px 10px; background: #999; border: none; border-radius: 4px; color: white; cursor: pointer;">Cancel</button>
          </div>
        </div>
      </div>
      <iframe src="financetracker.html"></iframe>
      <!-- Finance Tracker Page -->
    </div>
  </body>
</html>
